name: zero
description: "Zero / 零界 — Decentralized social network. Zero trace. Zero limit. Zero compromise."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.4.0
  flutter: ^3.22.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  pointycastle: ^3.9.0
  flutter_rust_bridge: ^2.0.0
  freezed_annotation: ^2.4.0
  json_annotation: ^4.9.0
  riverpod: ^2.5.0
  flutter_riverpod: ^2.5.0
  go_router: ^14.0.0
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.0
  uuid: ^4.4.0
  share_plus: ^9.0.0
  path_provider: ^2.1.0
  sqflite: ^2.3.0
  flutter_secure_storage: ^9.2.0
  barcode_widget: ^2.0.0
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.0
  freezed: ^2.5.0
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/fonts/
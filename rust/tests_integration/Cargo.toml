[package]
name = "zero_core_test"
version = "0.1.0"
edition = "2021"

[dependencies]
bip39 = { version = "2.0", features = ["rand"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
bs58 = "0.5"
anyhow = "1.0"
[package]
name = "zero_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
flutter_rust_bridge = "=2.9.0"

bip39 = { version = "2.0", features = ["rand"] }
ed25519-dalek = { version = "2.1", features = ["rand_core", "serde"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
hmac = "0.12"
aes-gcm = "0.10"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
bs58 = "0.5"

bitcoin = { version = "0.32", features = ["rand"] }

ethers-core = "2.0"
ethers-signers = "2.0"

solana-sdk = "2.2"

libp2p = { version = "0.54", features = ["tokio", "noise", "yamux", "tcp", "quic", "dns", "kad", "gossipsub", "identify", "relay", "dcutr"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"

thiserror = "2.0"
anyhow = "1.0"
once_cell = "1.19"
log = "0.4"